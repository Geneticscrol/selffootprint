  <text x="556" y="130" fill="#8aa08c" font-family="Segoe UI, sans-serif" font-size="12">cited, passive only</text>
  <rect x="792" y="70" width="280" height="90" fill="#141a16" stroke="#243028"/>
  <text x="812" y="108" fill="#e6efe6" font-family="Segoe UI, sans-serif" font-size="14">Scoring + playbooks</text>
