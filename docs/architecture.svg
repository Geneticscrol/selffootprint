  <text x="44" y="240" fill="#8aa08c" font-family="Segoe UI, sans-serif" font-size="12" letter-spacing="1">PUBLIC COLLECTORS</text>
  <text x="44" y="272" fill="#e6efe6" font-family="Segoe UI, sans-serif" font-size="13">Gravatar · GitHub API · username allowlist · DNS / DoH · RDAP · crt.sh · Wayback · XposedOrNot · optional HIBP</text>
